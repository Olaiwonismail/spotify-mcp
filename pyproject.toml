[project]
name = "spotify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "olaiwonismail", email = "olaiwonismail@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "fastmcp>=4.1.8",
    "httpx2>=2.16.0",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3.0",
    "questionary>=2.1.1",
    "typer>=0.29.0",
]

[project.scripts]
spotify = "spotify:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
